version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: digiicampus_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Ks@Kbd23777}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-digiicampus}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-Ks@Kbd23777}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: digiicampus_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-Ks@Kbd23777}@mysql:3306/${MYSQL_DATABASE:-digiicampus}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Ks@Kbd23777}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-digiicampus}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production_1234567890}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: digiicampus_worker
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-Ks@Kbd23777}@mysql:3306/${MYSQL_DATABASE:-digiicampus}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Ks@Kbd23777}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-digiicampus}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production_1234567890}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    depends_on:
      backend:
        condition: service_started
    command: python worker.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: digiicampus_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
